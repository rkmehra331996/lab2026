    <script>
      (function() {
        try {
          // Capture beforeinstallprompt globally for instant 1-click install on Desktop & Android
          window.__pwaDeferredPrompt = null;
          window.__pwaInstalled = false;
          window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__pwaDeferredPrompt = e;
            window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
          });
          window.addEventListener('appinstalled', function() {
            window.__pwaDeferredPrompt = null;
            window.__pwaInstalled = true;
            window.dispatchEvent(new CustomEvent('pwa-installed'));
          });

          // Ensure visiting homepage root opens clean public website
          var host = (window.location.hostname || '').toLowerCase();
          if ((host === 'indianlalaji.com' || host === 'www.indianlalaji.com') &&
              (window.location.pathname === '/' || window.location.pathname === '/index.html' || !window.location.pathname) &&
              !window.location.search) {
            try { localStorage.removeItem('cms_current_view'); } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
